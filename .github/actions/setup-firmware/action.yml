name: Set up the pinned firmware toolchain
description: >
  arduino-cli, the ESP32 core and the three libraries, every one at a fixed
  version. The one place those versions live: firmware-tests.yml, pages.yml and
  publish-release.yml all use this, so the board, the installer and a release
  can never be built with different toolchains.

# arduino-cli is downloaded directly and checked against its published SHA-256
# rather than through arduino/setup-arduino-cli. That action stopped at v2 on
# Node 20 (deprecated on GitHub's runners) and installs whatever arduino-cli is
# newest unless told otherwise -- a floating version nothing here had tested.
# Updating it is a deliberate act: change both values below together, taking
# the hash from the release's <version>-checksums.txt.
inputs:
  cli-version:
    default: "1.5.1"
  cli-sha256:
    default: "28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b"

runs:
  using: composite
  steps:
    - name: Install the checksum-pinned arduino-cli
      shell: bash
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/arduino-cli"
        mkdir -p "$dir"
        tarball="$dir/arduino-cli.tar.gz"
        curl --fail --location --max-time 150 --output "$tarball" \
          "https://github.com/arduino/arduino-cli/releases/download/v${{ inputs.cli-version }}/arduino-cli_${{ inputs.cli-version }}_Linux_64bit.tar.gz"
        printf '%s  %s\n' '${{ inputs.cli-sha256 }}' "$tarball" | sha256sum --check --strict
        tar -xzf "$tarball" -C "$dir" arduino-cli
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/arduino-cli" version

    - uses: actions/cache@v6
      with:
        path: |
          ~/.arduino15
          ~/Arduino/libraries
        key: arduino-${{ runner.os }}-cli-${{ inputs.cli-version }}-esp32-3.3.11-gfx-1.6.7-sensor-0.4.1-xpowers-0.3.3

    - name: Install the pinned ESP32 core and libraries
      shell: bash
      run: |
        set -euo pipefail
        url=https://espressif.github.io/arduino-esp32/package_esp32_index.json
        timeout 180 arduino-cli core update-index --additional-urls "$url"
        timeout 600 arduino-cli core install esp32:esp32@3.3.11 --additional-urls "$url"
        timeout 300 arduino-cli lib install "GFX Library for Arduino@1.6.7" "SensorLib@0.4.1" "XPowersLib@0.3.3"
