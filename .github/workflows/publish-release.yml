name: Publish firmware release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  firmware-tests:
    uses: ./.github/workflows/firmware-tests.yml
    permissions:
      contents: read
  release:
    needs: firmware-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and the main ref: check_release.py refuses a tag that is
          # not reachable from origin/main, and the default shallow checkout of a
          # single tag cannot answer that question.
          fetch-depth: 0

      - name: Fetch main for the tag-on-main check
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      # web/firmware/ is gitignored -- CI builds it (see pages.yml) -- so a fresh
      # checkout of the tag has no binaries at all, and check_release.py refuses
      # a manifest whose parts are missing. Without this build every tag failed
      # at "missing web/firmware/bootloader.bin" and nothing could ever publish.
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-esp32-3.3.11-gfx-1.6.7-sensor-0.4.1-xpowers-0.3.3
      - name: Install the pinned ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "GFX Library for Arduino@1.6.7" "SensorLib@0.4.1" "XPowersLib@0.3.3"
      - name: Build the tagged firmware
        run: bash tools/build_web.sh

      - name: Validate tagged firmware
        run: python3 tools/check_release.py "$GITHUB_REF_NAME"

      # --notes-file, never --generate-notes. The generated notes are a bare
      # "Full Changelog" compare link, and web/installer.js puts the release body
      # STRAIGHT ONTO THE INSTALLER PAGE -- so a generated release shows visitors
      # "No changelog was provided for this release." v3.20 shipped exactly that.
      # check_release.py refuses a tag with no notes file, so this cannot happen
      # quietly again.
      - name: Publish GitHub Release and changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "TamaDigi $GITHUB_REF_NAME" \
            --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"