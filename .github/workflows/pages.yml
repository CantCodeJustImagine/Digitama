name: Build installer and publish to Pages

# Builds the firmware in the cloud and publishes the web installer, so nobody
# needs the Arduino toolchain on their own computer: push to main, wait for this
# to finish, then open https://<user>.github.io/<repo>/web/ in Chrome or Edge.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-firmware
      - name: Compile the firmware and stamp the installer
        # Compiler errors are repeated as annotations, so they show on the run's
        # summary page without opening the raw log.
        run: |
          set -o pipefail
          if ! bash tools/build_web.sh 2>&1 | tee build.log; then
            grep -E "error|Error|undefined reference" build.log | head -25 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
      # The same firmware as a plain download (Actions -> this run -> Artifacts).
      # start.bat uses it when Pages is not available, e.g. a private repo on a
      # free GitHub plan: put tamadigi-firmware.zip next to start.bat or leave it
      # in Downloads.
      - uses: actions/upload-artifact@v7
        with:
          name: tamadigi-firmware
          path: |
            web/firmware/bootloader.bin
            web/firmware/partitions.bin
            web/firmware/boot_app0.bin
            web/firmware/app.bin
            web/manifest.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}web/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
